<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add money | PK-BOOSTER</title><link href="./output.css" rel="stylesheet">    <link rel="stylesheet" href="./toast.css">\n</head><body class="min-h-screen bg-[#FCF9FC] font-['Inter'] text-[#19131F]"><main class="mx-auto max-w-lg px-4 py-10"><a href="./wallet.html" class="text-sm font-semibold text-[#7C3AED]">← Back to wallet</a><section class="mt-6 rounded-2xl border border-[#EEE3EF] bg-white p-6 shadow-sm"><div class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#7C3AED] font-black text-white">PK</div><h1 class="mt-5 text-2xl font-extrabold">Add money</h1><p class="mt-2 text-sm text-[#746A7D]">Fund your PK-BOOSTER wallet securely with Paystack.</p><label class="mt-6 block text-sm font-semibold" for="amount">Amount (₦)</label><input id="amount" type="number" min="100" step="1" placeholder="Minimum ₦100" class="mt-2 w-full rounded-xl border border-[#E8DCEC] px-4 py-3 outline-none focus:border-[#7C3AED]"><p id="message" class="mt-3 hidden text-sm"></p><button id="pay" class="mt-5 w-full rounded-xl bg-[#7C3AED] px-4 py-3 font-bold text-white hover:bg-[#6D28D9]">Continue to payment</button></section></main><script>
const API=localStorage.getItem('apiBaseUrl')||'https://pk-booste.onrender.com';const btn=document.getElementById('pay'),msg=document.getElementById('message');btn.addEventListener('click',async()=>{const amount=Number(document.getElementById('amount').value),token=localStorage.getItem('token');if(!token){location.href='./login.html';return}if(!Number.isFinite(amount)||amount<100){msg.textContent='Enter at least ₦100.';msg.className='mt-3 text-sm text-red-600';return}btn.disabled=true;btn.textContent='Connecting to Paystack…';try{const r=await fetch(API+'/payments/initialize',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({amount,callback_url:'https://www.pk-booster.com/payment-callback.html'})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to start payment');location.href=d.authorization_url}catch(e){msg.textContent=e.message;msg.className='mt-3 text-sm text-red-600';btn.disabled=false;btn.textContent='Continue to payment'}});
</script>
    <script src="./toast.js"></script>\n</body></html>
