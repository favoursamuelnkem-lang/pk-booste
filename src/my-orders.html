
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | PK-BOOSTER</title>
    <link href="./output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-[#FCF9FC] font-sans text-[#19131F]">

<header class="sticky top-0 z-50 border-b border-[#EEE3EF] bg-white">
    <div class="mx-auto flex h-[54px] max-w-[1100px] items-center justify-between gap-3 px-4 sm:px-6">

        <a href="./order.html" class="flex shrink-0 items-center gap-2">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#7C3AED]">
                <span class="text-lg font-black text-white">PK</span>
            </div>
            <div class="hidden flex-col leading-none sm:flex">
                <span class="text-lg font-extrabold tracking-tight">PK-BOOSTER</span>
                <span class="mt-1 text-[9px] font-bold tracking-[1.5px] text-[#7C3AED]">SOCIAL GROWTH</span>
            </div>
        </a>

        <nav class="hidden items-center gap-1 md:flex">
            <a href="./order.html" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-[#62586C] hover:bg-[#FAF5FB]">Order</a>
            <a href="./my-orders.html" class="rounded-xl bg-[#F8EFFF] px-4 py-2.5 text-sm font-semibold text-[#7C3AED]">My orders</a>
            <a href="./wallet.html" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-[#62586C] hover:bg-[#FAF5FB]">Wallet</a>
            <button id="moreButton" type="button" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-[#62586C] hover:bg-[#FAF5FB]">More</button>
        </nav>

        <div class="flex shrink-0 items-center gap-2">
            <a href="./wallet.html" class="flex items-center gap-2 rounded-full border border-[#E8DCEC] py-1 pl-3 pr-1">
                <span id="walletBalance" class="text-xs font-bold sm:text-sm">₦0.00</span>
                <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#7C3AED] text-xl font-medium text-white">+</span>
            </a>

            <button type="button" class="flex items-center gap-1.5 rounded-xl border border-[#E8DCEC] px-2.5 py-2 text-xs font-semibold sm:text-sm">
                <span>◎</span> EN
                <span>⌄</span>
            </button>
        </div>
    </div>

    <nav class="flex justify-center gap-1 border-t border-[#F3EDF5] px-3 py-2 md:hidden">
        <a href="./order.html" class="rounded-lg px-3 py-2 text-xs font-semibold text-[#62586C]">Order</a>
        <a href="./my-orders.html" class="rounded-lg bg-[#F8EFFF] px-3 py-2 text-xs font-semibold text-[#7C3AED]">My orders</a>
        <a href="./wallet.html" class="rounded-lg px-3 py-2 text-xs font-semibold text-[#62586C]">Wallet</a>
        <button id="mobileMoreButton" type="button" class="rounded-lg px-3 py-2 text-xs font-semibold text-[#62586C]">More</button>
    </nav>

    <div id="moreMenu" class="hidden border-t border-[#EEE3EF] bg-white px-5 py-3">
        <div class="mx-auto flex max-w-[1100px] flex-wrap gap-5">
            <a href="./profile.html" class="text-sm font-medium">My profile</a>
            <a href="./support.html" class="text-sm font-medium">Support</a>
            <button id="logoutButton" type="button" class="text-sm font-medium text-red-600">Log out</button>
        </div>
    </div>

    <div id="mobileMoreMenu" class="hidden border-t border-[#EEE3EF] bg-white px-5 py-3 md:hidden">
        <div class="flex flex-wrap gap-5">
            <a href="./profile.html" class="text-sm font-medium">My profile</a>
            <a href="./support.html" class="text-sm font-medium">Support</a>
            <button id="mobileLogoutButton" type="button" class="text-sm font-medium text-red-600">Log out</button>
        </div>
    </div>
</header>

<main class="mx-auto min-h-[calc(100vh-54px)] max-w-[1100px] px-4 pb-16 pt-6 sm:px-6 sm:pt-8">

    <section class="mx-auto w-full max-w-[610px]">

        <div class="mb-5 flex items-center justify-between">
            <h1 class="text-[25px] font-extrabold tracking-tight sm:text-[28px]">My orders</h1>

            <button id="refreshButton" type="button" aria-label="Refresh orders" class="flex h-10 w-10 items-center justify-center rounded-xl text-[#62586C] transition hover:bg-[#F1E8F5] hover:text-[#7C3AED]">
                <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path d="M20 7v5h-5"/>
                    <path d="M4 17v-5h5"/>
                    <path d="M5.5 9a7 7 0 0 1 11.8-2L20 12"/>
                    <path d="M18.5 15a7 7 0 0 1-11.8 2L4 12"/>
                </svg>
            </button>
        </div>

        <form id="searchForm" class="flex gap-2">
            <div class="relative flex-1">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-[#82788A]" xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <circle cx="10.8" cy="10.8" r="7.3"/>
                    <path d="m16.2 16.2 5 5"/>
                </svg>

                <input id="searchInput" type="search" placeholder="Order number or link" class="h-[48px] w-full rounded-xl border border-[#DED1E4] bg-white pl-11 pr-4 text-sm outline-none transition focus:border-[#7C3AED] focus:ring-2 focus:ring-[#7C3AED]/10">
            </div>

            <button type="submit" class="h-[48px] rounded-xl bg-[#7C3AED] px-5 text-sm font-bold text-white transition hover:bg-[#6D28D9]">
                Search
            </button>
        </form>

        <div id="filterContainer" class="mt-4 flex gap-2 overflow-x-auto pb-2">
            <button data-status="All" class="filter-button shrink-0 rounded-full bg-[#19131F] px-4 py-2.5 text-xs font-semibold text-white">All</button>
            <button data-status="Pending" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">Pending</button>
            <button data-status="In progress" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">In progress</button>
            <button data-status="Processing" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">Processing</button>
            <button data-status="Completed" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">Completed</button>
            <button data-status="Partial" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">Partial</button>
            <button data-status="Canceled" class="filter-button shrink-0 rounded-full border border-[#E4D8E7] bg-white px-4 py-2.5 text-xs font-semibold">Canceled</button>
        </div>

        <div id="ordersContainer" class="mt-3 space-y-2.5"></div>

        <div id="emptyState" class="hidden rounded-2xl border border-[#EEE3EF] bg-white px-5 py-12 text-center">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-[#F8EFFF] text-[#7C3AED]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path d="M7 3h10l4 4v14H3V3h4Z"/>
                    <path d="M7 3v5h10V3"/>
                    <path d="M8 14h8M8 18h5"/>
                </svg>
            </div>
            <h2 class="mt-4 text-base font-bold">No orders found</h2>
            <p class="mt-1 text-sm text-[#82788A]">Your orders will appear here.</p>
            <a href="./order.html" class="mt-5 inline-flex rounded-xl bg-[#7C3AED] px-5 py-3 text-sm font-bold text-white">Start an order</a>
        </div>

        <p id="pageMessage" class="mt-4 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600"></p>

    </section>

</main>

<script>
    const ordersContainer = document.getElementById("ordersContainer");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-button");
    const refreshButton = document.getElementById("refreshButton");
    const refreshIcon = document.getElementById("refreshIcon");
    const pageMessage = document.getElementById("pageMessage");

    let orders = [];
    let activeFilter = "All";
    let searchTerm = "";

    function formatNaira(amount) {
        return new Intl.NumberFormat("en-NG", {
            style: "currency",
            currency: "NGN",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(Number(amount || 0));
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[character]));
    }

    function getStatusClass(status) {
        const styles = {
            "Pending": "bg-yellow-100 text-yellow-700",
            "In progress": "bg-blue-100 text-blue-700",
            "Processing": "bg-purple-100 text-purple-700",
            "Completed": "bg-green-100 text-green-700",
            "Partial": "bg-orange-100 text-orange-700",
            "Canceled": "bg-red-100 text-red-700"
        };

        return styles[status] || "bg-gray-100 text-gray-700";
    }

    function renderOrders() {
        const filteredOrders = orders.filter(order => {
            const matchesStatus = activeFilter === "All" || order.status === activeFilter;

            const searchable = [
                order.id,
                order.platform,
                order.service,
                order.link
            ].join(" ").toLowerCase();

            const matchesSearch = searchable.includes(searchTerm.toLowerCase());

            return matchesStatus && matchesSearch;
        });

        ordersContainer.innerHTML = "";

        emptyState.classList.toggle("hidden", filteredOrders.length > 0);

        filteredOrders.forEach(order => {
            const card = document.createElement("article");

            card.className = "overflow-hidden rounded-2xl border border-[#EEE3EF] bg-white";

            const delivered = Number(order.delivered || 0);
            const quantity = Number(order.quantity || 0);

            const deliveryText = order.status === "Partial"
                ? `${delivered} of ${quantity} delivered`
                : order.status === "Completed"
                    ? `All ${quantity.toLocaleString()} delivered`
                    : `${delivered.toLocaleString()} of ${quantity.toLocaleString()} delivered`;

            card.innerHTML = `
                <button type="button" class="order-toggle w-full px-4 py-4 text-left sm:px-5">
                    <div class="flex items-start justify-between gap-3">
                        <h2 class="min-w-0 flex-1 text-sm font-bold leading-5">
                            ${escapeHTML(order.platform)} · ${escapeHTML(order.service)} · ${quantity.toLocaleString()}
                        </h2>

                        <span class="shrink-0 rounded-full px-3 py-1 text-[11px] font-bold ${getStatusClass(order.status)}">
                            ${escapeHTML(order.status)}
                        </span>
                    </div>

                    <div class="mt-2 flex items-center justify-between gap-3">
                        <p class="min-w-0 truncate text-xs text-[#82788A] sm:text-sm">
                            #${escapeHTML(order.id)} · ${escapeHTML(order.link)} · ${formatNaira(order.price)}
                        </p>

                        <svg class="order-chevron shrink-0 text-[#82788A] transition-transform" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </div>

                    <p class="mt-2 text-xs text-[#62586C]">
                        ${escapeHTML(deliveryText)}
                    </p>

                    ${order.status === "Partial" ? `
                        <p class="mt-1 text-xs font-semibold text-green-700">
                            The remaining amount was refunded to your balance.
                        </p>
                    ` : ""}
                </button>

                <div class="order-details hidden border-t border-[#EEE3EF] bg-[#FFFCFF] px-4 py-4 sm:px-5">
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="text-xs text-[#82788A]">Order number</p>
                            <p class="mt-1 font-semibold">#${escapeHTML(order.id)}</p>
                        </div>

                        <div>
                            <p class="text-xs text-[#82788A]">Amount</p>
                            <p class="mt-1 font-semibold">${formatNaira(order.price)}</p>
                        </div>

                        <div>
                            <p class="text-xs text-[#82788A]">Quantity</p>
                            <p class="mt-1 font-semibold">${quantity.toLocaleString()}</p>
                        </div>

                        <div>
                            <p class="text-xs text-[#82788A]">Delivered</p>
                            <p class="mt-1 font-semibold">${delivered.toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="mt-4">
                        <p class="text-xs text-[#82788A]">Order link</p>
                        <a href="${escapeHTML(order.link)}" target="_blank" rel="noopener noreferrer" class="mt-1 block break-all text-sm font-medium text-[#7C3AED]">
                            ${escapeHTML(order.link)}
                        </a>
                    </div>

                    <div class="mt-4">
                        <p class="text-xs text-[#82788A]">Date</p>
                        <p class="mt-1 text-sm font-medium">${escapeHTML(order.date || "Not available")}</p>
                    </div>
                </div>
            `;

            const toggle = card.querySelector(".order-toggle");
            const details = card.querySelector(".order-details");
            const chevron = card.querySelector(".order-chevron");

            toggle.addEventListener("click", () => {
                details.classList.toggle("hidden");
                chevron.classList.toggle("rotate-180");
            });

            ordersContainer.appendChild(card);
        });
    }

    function updateFilterButtons() {
        filterButtons.forEach(button => {
            const active = button.dataset.status === activeFilter;

            button.classList.toggle("bg-[#19131F]", active);
            button.classList.toggle("text-white", active);

            button.classList.toggle("bg-white", !active);
            button.classList.toggle("border", !active);
            button.classList.toggle("border-[#E4D8E7]", !active);
        });
    }

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            activeFilter = button.dataset.status;
            updateFilterButtons();
            renderOrders();
        });
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
        event.preventDefault();
        searchTerm = searchInput.value.trim();
        renderOrders();
    });

    searchInput.addEventListener("input", () => {
        searchTerm = searchInput.value.trim();
        renderOrders();
    });

    async function loadOrders() {
        refreshButton.disabled = true;
        refreshIcon.classList.add("animate-spin");

        try {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "./login.html";
                return;
            }

            const response = await fetch("/my-orders", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error("Unable to load your orders.");
            }

            const data = await response.json();

            orders = Array.isArray(data) ? data : data.orders || [];

            renderOrders();

            pageMessage.classList.add("hidden");

        } catch (error) {
            orders = [];

            renderOrders();

            pageMessage.textContent = error.message || "Unable to load orders. Please try again.";

            pageMessage.classList.remove("hidden");

        } finally {
            refreshButton.disabled = false;
            refreshIcon.classList.remove("animate-spin");
        }
    }

    refreshButton.addEventListener("click", loadOrders);

    function loadWalletBalance() {
        const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");

        const storedBalance = localStorage.getItem("walletBalance");

        const balance = storedBalance !== null
            ? Number(storedBalance)
            : Number(currentUser.balance || 0);

        document.getElementById("walletBalance").textContent = formatNaira(balance);
    }

    document.getElementById("moreButton").addEventListener("click", () => {
        document.getElementById("moreMenu").classList.toggle("hidden");
    });

    document.getElementById("mobileMoreButton").addEventListener("click", () => {
        document.getElementById("mobileMoreMenu").classList.toggle("hidden");
    });

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("currentUser");

        window.location.href = "./login.html";
    }

    document.getElementById("logoutButton").addEventListener("click", logout);

    document.getElementById("mobileLogoutButton").addEventListener("click", logout);

    loadWalletBalance();
    updateFilterButtons();
    loadOrders();
</script>

</body>
</html>
```
