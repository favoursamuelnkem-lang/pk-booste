<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK-BOOSTER Admin</title><link rel="stylesheet" href="./output.css">
<style>body{font-family:Inter,Arial,sans-serif;background:#fcf9fc;color:#20152b}.brand{background:#7c3aed}.panel{background:white;border:1px solid #eee7f5;border-radius:16px}.btn{background:#7c3aed;color:white;border-radius:10px;padding:10px 14px}.field{border:1px solid #ddd3e8;border-radius:9px;padding:10px;width:100%}</style>
</head>
<body>
<header class="brand text-white px-5 py-4 flex flex-wrap items-center justify-between gap-3"><div class="font-bold text-xl">PK-BOOSTER <span class="text-sm font-normal">ADMIN</span></div><button id="logout" class="rounded-lg bg-white/20 px-4 py-2">Log out</button></header>
<main class="max-w-7xl mx-auto p-4 md:p-8">
<div class="flex flex-wrap justify-between items-center gap-3 mb-6"><div><h1 class="text-2xl md:text-3xl font-bold">Admin dashboard</h1><p class="text-gray-500">Manage users, balances, services and orders.</p></div><button class="btn" onclick="loadAll()">Refresh</button></div>
<div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"></div>
<div class="grid lg:grid-cols-2 gap-5">
<section class="panel p-4 md:p-5"><h2 class="text-xl font-bold mb-4">Users & balance management</h2><input id="search" class="field mb-3" placeholder="Search name or email" oninput="renderUsers()"><div id="users" class="overflow-x-auto"></div></section>
<section class="panel p-4 md:p-5"><h2 class="text-xl font-bold mb-4">Add social service</h2><form id="serviceForm" class="space-y-3"><input class="field" name="name" placeholder="Service name (e.g. Instagram followers)" required><input class="field" name="platform" placeholder="Platform" required><input class="field" name="pricePer1000" type="number" min="0" step="0.01" placeholder="Price per 1000 (₦)" required><div class="grid grid-cols-2 gap-3"><input class="field" name="min" type="number" placeholder="Minimum quantity" value="10"><input class="field" name="max" type="number" placeholder="Maximum quantity" value="100000"></div><textarea class="field" name="description" placeholder="Description"></textarea><button class="btn w-full">Add service</button></form><p id="serviceMsg" class="text-sm mt-3"></p><h3 class="font-bold mt-6 mb-2">Services</h3><div id="services" class="overflow-x-auto"></div></section>
<section class="panel p-4 md:p-5 lg:col-span-2"><h2 class="text-xl font-bold mb-4">Orders</h2><div id="orders" class="overflow-x-auto"></div></section>
<section class="panel p-4 md:p-5 lg:col-span-2"><h2 class="text-xl font-bold mb-4">Recent transactions</h2><div id="transactions" class="overflow-x-auto"></div></section>
</div></main>
<script>
const API="http://localhost:5000",token=localStorage.getItem("token");let users=[];
const headers={"Content-Type":"application/json","Authorization":`Bearer ${token}`};
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{...headers,...options.headers}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||"Request failed");return d}
function table(rows,cols){return `<table class="min-w-full text-sm"><thead><tr>${cols.map(c=>`<th class="text-left p-2 bg-purple-50">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr class="border-t">${row.map(x=>`<td class="p-2 align-top">${x}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
async function loadAll(){try{const [o,u,s,t]=await Promise.all([api("/admin/overview"),api("/admin/users"),api("/services"),api("/admin/transactions")]);users=u.users;document.getElementById("stats").innerHTML=[["Users",o.users],["Orders",o.orders],["Services",o.services],["Pending orders",o.pending]].map(([a,b])=>`<div class="panel p-4"><p class="text-gray-500">${a}</p><strong class="text-2xl">${b}</strong></div>`).join("");renderUsers();document.getElementById("services").innerHTML=table(s.services.map(x=>[x.platform,x.name,`₦${x.pricePer1000}/1k`,x.active?"Active":"Disabled",`<button class="btn" onclick="toggleService('${x._id}',${!x.active})">${x.active?"Disable":"Enable"}</button>`]),["Platform","Service","Price","Status","Action"]);const ord=await api("/admin/orders");document.getElementById("orders").innerHTML=table(ord.orders.map(x=>[x.user?.email||"User",x.serviceName,x.quantity,`₦${x.amount}`,x.status,`<select class="field" onchange="setOrder('${x._id}',this.value)">${["Pending","Processing","Completed","Cancelled","Failed"].map(v=>`<option ${v===x.status?"selected":""}>${v}</option>`).join("")}</select>`]),["User","Service","Qty","Amount","Status","Update"]);document.getElementById("transactions").innerHTML=table(t.transactions.slice(0,100).map(x=>[x.user?.email||"",x.type,`₦${x.amount}`,`₦${x.balanceAfter}`,x.note||"",new Date(x.createdAt).toLocaleString()]),["User","Type","Amount","Balance","Note","Date"]);}catch(e){alert(e.message);if(!token)location.href="./login.html"}}
function renderUsers(){const q=document.getElementById("search").value.toLowerCase();const rows=users.filter(u=>(u.fullName+" "+u.email).toLowerCase().includes(q)).map(u=>[u.fullName,u.email,`₦${Number(u.balance).toLocaleString()}`,u.role,`<div class="min-w-52 space-y-2"><input id="amt-${u._id}" class="field" type="number" min="1" placeholder="Amount ₦"><input id="note-${u._id}" class="field" placeholder="Reason (optional)"><div class="flex gap-2"><button class="btn" onclick="adjust('${u._id}','credit')">Deposit</button><button class="btn" onclick="adjust('${u._id}','debit')">Deduct</button></div></div>`]);document.getElementById("users").innerHTML=table(rows,["Name","Email","Balance","Role","Adjust balance"])}
async function adjust(id,action){const amount=document.getElementById("amt-"+id).value,note=document.getElementById("note-"+id).value;if(!amount||Number(amount)<=0)return alert("Enter a valid amount.");if(!confirm(`${action==="credit"?"Add":"Deduct"} ₦${amount} ${action==="credit"?"to":"from"} this user?`))return;try{await api(`/admin/users/${id}/adjust-balance`,{method:"POST",body:JSON.stringify({amount,action,note})});await loadAll();alert("Balance updated.")}catch(e){alert(e.message)}}
document.getElementById("serviceForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f.entries());try{await api("/admin/services",{method:"POST",body:JSON.stringify(body)});e.target.reset();document.getElementById("serviceMsg").textContent="Service added.";loadAll()}catch(e){document.getElementById("serviceMsg").textContent=e.message}};
async function toggleService(id,active){try{await api(`/admin/services/${id}`,{method:"PATCH",body:JSON.stringify({active})});loadAll()}catch(e){alert(e.message)}}
async function setOrder(id,status){try{await api(`/admin/orders/${id}`,{method:"PATCH",body:JSON.stringify({status})});loadAll()}catch(e){alert(e.message)}}
document.getElementById("logout").onclick=()=>{localStorage.removeItem("token");localStorage.removeItem("currentUser");location.href="./login.html"};
if(!token)location.href="./login.html";else loadAll();
</script></body></html>
