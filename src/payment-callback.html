<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | PK-BOOSTER</title><link href="./output.css" rel="stylesheet">    <link rel="stylesheet" href="./toast.css"><link rel="icon" type="image/png" href="assets/favicon.png"></head><body class="min-h-screen bg-[#FCF9FC] font-['Inter'] text-[#19131F]"><main class="mx-auto max-w-md px-4 py-16"><section class="rounded-2xl border border-[#EEE3EF] bg-white p-6 text-center"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-[#7C3AED] font-black text-white">PK</div><h1 class="mt-5 text-xl font-extrabold">Checking your payment</h1><p id="status" class="mt-3 text-sm text-[#746A7D]">Please wait while we verify your payment.</p><a href="./wallet.html" class="mt-6 inline-block rounded-xl bg-[#7C3AED] px-5 py-3 font-bold text-white">Return to wallet</a></section></main><script>
(async()=>{
 const status=document.getElementById('status');
 const params=new URLSearchParams(location.search);
 const ref=params.get('reference')||params.get('trxref');
 const token=localStorage.getItem('token');
 const user=localStorage.getItem('currentUser');
 // Keep the canonical www domain consistent with the payment initiation page.
 if(location.hostname==='pk-booster.com'){location.replace('https://www.pk-booster.com/payment-callback.html'+location.search);return;}
 const API=localStorage.getItem('apiBaseUrl')||'https://pk-booste.onrender.com';
 if(!ref){status.textContent='Payment reference is missing. Open your wallet and check your transactions.';return;}
 if(!token){status.textContent='Payment returned, but this browser session is not logged in. Please log in, then open Wallet and refresh transactions. Your payment can still be verified by the backend webhook.';return;}
 try{
  const response=await fetch(API+'/payments/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token}});
  const data=await response.json();
  if(!response.ok)throw new Error(data.message||'Payment verification failed.');
  status.textContent=(data.message||'Payment verified.')+' Redirecting to your wallet…';
  setTimeout(()=>location.replace('./wallet.html?payment='+encodeURIComponent(data.credited?'success':'verified')),1200);
 }catch(error){
  status.textContent=(error.message||'Payment could not be verified.')+' You can return to your wallet and retry verification from the transaction reference.';
  const link=document.querySelector('a');link.textContent='Return to wallet';link.href='./wallet.html';
 }
})();
</script>
    <script src="./toast.js"></script>\n</body></html>
