<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose service | PK-BOOSTER</title><link rel="stylesheet" href="./output.css"><style>body{font-family:Inter,Arial,sans-serif} .card{border:1px solid #eee3f3;background:#fff;border-radius:16px} .btn{background:#7c3aed;color:white;border-radius:12px;padding:12px 18px;font-weight:700} .field{width:100%;border:1px solid #e4d8ed;border-radius:11px;padding:12px;outline:none} .field:focus{border-color:#7c3aed}</style></head>
<body class="min-h-screen bg-[#FCF9FC] text-[#19131F]">
<header class="border-b border-[#EEE3EF] bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4"><a href="./order.html" class="font-extrabold text-xl"><span class="mr-2 rounded-xl bg-[#7C3AED] px-2 py-1 text-white">PK</span> PK-BOOSTER</a><a href="./order.html" class="text-sm font-semibold text-[#7C3AED]">← Back to order</a></div></header>
<main class="mx-auto max-w-4xl px-4 py-8 md:py-12"><div class="mb-6"><p class="text-sm font-semibold text-[#7C3AED]">STEP 2 OF 4</p><h1 class="mt-2 text-3xl font-extrabold">Choose your service</h1><p class="mt-2 text-[#746A7D]">Services are loaded directly from Owlet.</p></div>
<section class="card p-5 md:p-7"><div class="grid gap-4 md:grid-cols-2"><div><label class="mb-2 block text-sm font-bold" for="platform">Platform</label><select id="platform" class="field"><option>TikTok</option><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>Telegram</option><option>WhatsApp</option><option>Other</option></select></div><div><label class="mb-2 block text-sm font-bold" for="service">Owlet service</label><select id="service" class="field"><option value="">Loading services…</option></select></div></div>
<div id="details" class="mt-5 hidden rounded-xl bg-purple-50 p-4 text-sm"></div>
<form id="orderForm" class="mt-5 space-y-4"><div><label class="mb-2 block text-sm font-bold" for="link">Target link</label><input id="link" class="field" type="url" placeholder="https://..." required></div><div><label class="mb-2 block text-sm font-bold" for="quantity">Quantity</label><input id="quantity" class="field" type="number" min="1" step="1" placeholder="Enter quantity" required></div><div id="optional"></div><p id="message" class="hidden text-sm"></p><div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"><a href="./order.html" class="text-center text-sm font-semibold text-[#746A7D]">Back</a><button id="submit" class="btn" type="submit">Place order</button></div></form></section></main>
<script>
const API=localStorage.getItem("apiBaseUrl")||"https://pk-booste.onrender.com",token=localStorage.getItem("token");
const platform=document.getElementById("platform"),serviceSelect=document.getElementById("service"),details=document.getElementById("details"),message=document.getElementById("message"),submit=document.getElementById("submit");
let services=[];
function norm(s){return String(s||"").toLowerCase()}
function filtered(){const p=norm(platform.value);return services.filter(s=>{const n=norm(s.name+" "+(s.category||"")+" "+(s.platform||""));return p==="other"?(!["tiktok","instagram","facebook","youtube","telegram","whatsapp"].some(x=>n.includes(x))):n.includes(p)})}
function render(){const list=filtered();serviceSelect.innerHTML='<option value="">Select a service</option>'+list.map(s=>`<option value="${s.service}">${escapeHtml(s.name)} — ₦${Number(s.rate||0).toLocaleString()} / 1,000</option>`).join("");if(!list.length)serviceSelect.innerHTML='<option value="">No services found for this platform</option>';details.classList.add("hidden");}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function selected(){return services.find(s=>String(s.service)===serviceSelect.value)}
serviceSelect.addEventListener("change",()=>{const s=selected();if(!s){details.classList.add("hidden");return}details.innerHTML=`<div class="font-bold">${escapeHtml(s.name)}</div><div class="mt-1">Price: ₦${Number(s.rate||0).toLocaleString()} per 1,000 · Minimum: ${s.min??1} · Maximum: ${s.max??"—"}</div>`;details.classList.remove("hidden");document.getElementById("quantity").min=s.min||1;document.getElementById("quantity").max=s.max||""});
platform.addEventListener("change",render);
document.getElementById("orderForm").addEventListener("submit",async e=>{e.preventDefault();if(!token){location.href="./login.html";return}const s=selected(),quantity=Number(document.getElementById("quantity").value),link=document.getElementById("link").value.trim();if(!s){show("Choose an Owlet service.",false);return}if(!Number.isInteger(quantity)||quantity<Number(s.min||1)||quantity>Number(s.max||Number.MAX_SAFE_INTEGER)){show(`Quantity must be between ${s.min||1} and ${s.max||"the maximum"}.`,false);return}submit.disabled=true;submit.textContent="Submitting order…";try{const r=await fetch(API+"/orders/owlet",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({service:Number(s.service),serviceName:s.name,platform:platform.value,link,quantity})});const d=await r.json();if(!r.ok)throw Error(d.message||"Order failed");localStorage.setItem("currentUser",JSON.stringify({...JSON.parse(localStorage.getItem("currentUser")||"{}"),balance:d.balance}));show("Order submitted successfully. Your wallet balance is ₦"+Number(d.balance).toFixed(2),true);setTimeout(()=>location.href="./my-orders.html",1200)}catch(err){show(err.message,false)}finally{submit.disabled=false;submit.textContent="Place order"}});
function show(t,ok){message.textContent=t;message.className="text-sm "+(ok?"text-green-700":"text-red-600");message.classList.remove("hidden")}
async function load(){if(!token){location.href="./login.html";return}serviceSelect.innerHTML="<option>Loading Owlet services…</option>";try{const r=await fetch(API+"/provider/owlet/services",{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load Owlet services");services=Array.isArray(d.services)?d.services:[];render()}catch(e){serviceSelect.innerHTML='<option value="">Could not load services</option>';show(e.message+" Check Owlet API key and backend.",false)}}
load();
</script><style id="pk-toast-styles">
#pk-toast-container{position:fixed;top:18px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.pk-toast{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:14px;background:#fff;border:1px solid #e9e2ee;box-shadow:0 12px 35px rgba(25,19,31,.16);font:500 14px/1.45 Inter,system-ui,sans-serif;color:#19131f;pointer-events:auto;animation:pkToastIn .22s ease-out}
.pk-toast-icon{display:grid;place-items:center;flex:0 0 24px;height:24px;border-radius:50%;font-weight:800}
.pk-toast-success{border-left:4px solid #16a34a}.pk-toast-success .pk-toast-icon{background:#dcfce7;color:#15803d}
.pk-toast-error{border-left:4px solid #dc2626}.pk-toast-error .pk-toast-icon{background:#fee2e2;color:#b91c1c}
.pk-toast-info{border-left:4px solid #2563eb}.pk-toast-info .pk-toast-icon{background:#dbeafe;color:#1d4ed8}
.pk-toast-warning{border-left:4px solid #f97316}.pk-toast-warning .pk-toast-icon{background:#ffedd5;color:#c2410c}
.pk-toast-message{flex:1;overflow-wrap:anywhere}.pk-toast-close{border:0;background:transparent;color:#887f91;font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 4px}
@keyframes pkToastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pkToastOut{to{opacity:0;transform:translateX(12px)}}
@media(max-width:480px){#pk-toast-container{top:10px;right:10px;width:calc(100vw - 20px)}}
</style>
<script id="pk-toast-script">
(function(){
  if(window.showToast)return;
  const symbols={success:"✓",error:"×",info:"i",warning:"!"};
  function toast(message,type="info",duration=4200){
    type=["success","error","info","warning"].includes(type)?type:"info";
    let container=document.getElementById("pk-toast-container");
    if(!container){container=document.createElement("div");container.id="pk-toast-container";container.setAttribute("aria-live","polite");container.setAttribute("aria-atomic","false");document.body.appendChild(container);}
    const item=document.createElement("div");item.className="pk-toast pk-toast-"+type;item.setAttribute("role",type==="error"?"alert":"status");
    const icon=document.createElement("span");icon.className="pk-toast-icon";icon.textContent=symbols[type];
    const text=document.createElement("span");text.className="pk-toast-message";text.textContent=String(message??"");
    const close=document.createElement("button");close.className="pk-toast-close";close.type="button";close.setAttribute("aria-label","Dismiss notification");close.textContent="×";
    item.append(icon,text,close);container.appendChild(item);
    let timer=setTimeout(remove,duration);function remove(){clearTimeout(timer);item.style.animation="pkToastOut .18s ease-in forwards";setTimeout(()=>item.remove(),180);}
    close.addEventListener("click",remove);
    return item;
  }
  window.showToast=toast;
  window.toastSuccess=(m,d)=>toast(m,"success",d);
  window.toastError=(m,d)=>toast(m,"error",d);
  window.toastInfo=(m,d)=>toast(m,"info",d);
  window.toastWarning=(m,d)=>toast(m,"warning",d);
  // Convert existing alert() calls to a non-blocking error toast.
  window.alert=function(message){toast(message,"error");};
})();
</script>
</body></html>
