<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose service | PK-BOOSTER</title><link rel="stylesheet" href="./output.css"><style>body{font-family:Inter,Arial,sans-serif} .card{border:1px solid #eee3f3;background:#fff;border-radius:16px} .btn{background:#7c3aed;color:white;border-radius:12px;padding:12px 18px;font-weight:700} .field{width:100%;border:1px solid #e4d8ed;border-radius:11px;padding:12px;outline:none} .field:focus{border-color:#7c3aed}</style>    <link rel="stylesheet" href="./toast.css"><link rel="icon" type="image/png" href="assets/favicon.png"></head>
<body class="min-h-screen bg-[#FCF9FC] text-[#19131F]">
<header class="border-b border-[#EEE3EF] bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4"><a href="./order.html" class="font-extrabold text-xl"><span class="mr-2 rounded-xl bg-[#7C3AED] px-2 py-1 text-white">PK</span> PK-BOOSTER</a><a href="./order.html" class="text-sm font-semibold text-[#7C3AED]">← Back to order</a></div></header>
<main class="mx-auto max-w-4xl px-4 py-8 md:py-12"><div class="mb-6"><p class="text-sm font-semibold text-[#7C3AED]">STEP 2 OF 4</p><h1 class="mt-2 text-3xl font-extrabold">Choose your service</h1><p class="mt-2 text-[#746A7D]">Choose a platform, boost type, and service.</p></div>
<section class="card p-5 md:p-7"><div class="grid gap-4 md:grid-cols-2"><div><label class="mb-2 block text-sm font-bold" for="platform">Social platform</label><select id="platform" class="field"><option>TikTok</option><option>Instagram</option><option>Facebook</option><option>YouTube</option><option>Telegram</option><option>WhatsApp</option><option>Other</option></select></div><div><label class="mb-2 block text-sm font-bold" for="boostType">Boost type</label><select id="boostType" class="field"><option value="">Choose boost type</option><option>Followers</option><option>Likes</option><option>Views</option><option>Comments</option><option>Shares</option><option>Subscribers</option><option>Engagement</option><option>Other</option></select></div></div>
<div class="mt-4"><label class="mb-2 block text-sm font-bold" for="service">Service</label><select id="service" class="field"><option value="">Loading services…</option></select></div>
<div id="details" class="mt-5 hidden rounded-xl bg-purple-50 p-4 text-sm"></div>
<form id="orderForm" class="mt-5 space-y-4"><div><label class="mb-2 block text-sm font-bold" for="link">Target link</label><input id="link" class="field" type="url" placeholder="https://..." required></div><div><label class="mb-2 block text-sm font-bold" for="quantity">Quantity</label><input id="quantity" class="field" type="number" min="1" step="1" placeholder="Enter quantity" required></div><div id="optional"></div>
<div id="orderSummary" class="rounded-2xl border border-[#E9DFF0] bg-[#FAF7FC] p-4">
 <p class="font-bold">Order summary</p>
 <div class="mt-3 flex justify-between gap-4 text-sm"><span class="text-[#746A7D]">Platform</span><span id="summaryPlatform" class="font-semibold">TikTok</span></div>
 <div class="mt-2 flex justify-between gap-4 text-sm"><span class="text-[#746A7D]">Boost type</span><span id="summaryType" class="font-semibold">—</span></div>
 <div class="mt-2 flex justify-between gap-4 text-sm"><span class="text-[#746A7D]">Service</span><span id="summaryService" class="font-semibold text-right">—</span></div>
 <div class="mt-2 flex justify-between gap-4 text-sm"><span class="text-[#746A7D]">Price per 1,000</span><span id="summaryRate" class="font-semibold">—</span></div>
 <div class="mt-2 flex justify-between gap-4 text-sm"><span class="text-[#746A7D]">Quantity</span><span id="summaryQuantity" class="font-semibold">—</span></div>
 <div class="mt-3 border-t border-[#E9DFF0] pt-3 flex justify-between gap-4"><span class="font-bold">Estimated total</span><span id="summaryTotal" class="font-extrabold text-[#7C3AED]">₦0.00</span></div>
 <p class="mt-2 text-xs text-[#746A7D]">Final price is confirmed by the server when you place the order.</p>
</div>
<p id="message" class="hidden text-sm"></p><div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"><a href="./order.html" class="text-center text-sm font-semibold text-[#746A7D]">Back</a><button id="submit" class="btn" type="submit">Place order</button></div></form></section></main>
<script>const API=localStorage.getItem("apiBaseUrl")||"https://pk-booste.onrender.com",token=localStorage.getItem("token");
const platform=document.getElementById("platform"),serviceSelect=document.getElementById("service"),details=document.getElementById("details"),message=document.getElementById("message"),submit=document.getElementById("submit");
const boostType=document.getElementById("boostType"),quantityInput=document.getElementById("quantity"),linkInput=document.getElementById("link");
let services=[];
function norm(s){return String(s||"").toLowerCase()}
function detectType(s){const id=String(s.providerServiceId||s.service||"");if(id==="8288"||id==="23425")return "followers";if(id==="21632")return "likes";if(id==="23148"||id==="20884")return "views";const explicit=norm(s.boostType);if(explicit&&explicit!=="other")return explicit;const n=norm([s.name,s.category,s.type].join(" "));if(/follower|follow/.test(n))return "followers";if(/like/.test(n))return "likes";if(/view|watch/.test(n))return "views";if(/comment/.test(n))return "comments";if(/share/.test(n))return "shares";if(/subscriber/.test(n))return "subscribers";if(/engagement/.test(n))return "engagement";return "other"}
function platformKey(value){const v=norm(value).replace(/[^a-z0-9]/g,"");if(v.includes("tiktok"))return "tiktok";if(v.includes("instagram"))return "instagram";if(v.includes("facebook"))return "facebook";if(v.includes("youtube"))return "youtube";if(v.includes("telegram"))return "telegram";if(v.includes("whatsapp"))return "whatsapp";return "other"}
function servicePlatform(s){const id=String(s.providerServiceId||s.service||"");if(["8288","23425","21632","23148","20884"].includes(id))return "tiktok";for(const value of [s.platform,s.name,s.category]){const key=platformKey(value);if(key!=="other")return key}return "other"}
function filtered(){const p=platformKey(platform.value),t=norm(boostType.value);let list=services.filter(s=>servicePlatform(s)===p&&(!t||detectType(s)===t));if(p!=="tiktok")list=list.slice(0,3);return list}
function money(n){return new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN"}).format(Number(n)||0)}
function render(){
 const previousValue=serviceSelect.value;
 const list=filtered();
 const options='<option value="">Select a service</option>'+list.map(s=>`<option value="${String(s.providerServiceId)}">${escapeHtml(s.name)} — ${money(s.pricePer1000)} / 1,000</option>`).join("");
 serviceSelect.innerHTML=options;
 // Preserve the user's current selection when the background catalogue refreshes.
 if(previousValue && list.some(s=>String(s.providerServiceId)===previousValue)) serviceSelect.value=previousValue;
 const current=selected();
 if(current) showSelectedDetails(current); else { details.classList.add("hidden"); refreshSummary(); }
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function selected(){return services.find(s=>String(s.providerServiceId)===serviceSelect.value)}
function sellingRate(s){const n=Number(s?.pricePer1000);return Number.isFinite(n)?n:0}
function showSelectedDetails(s){
 details.innerHTML=`<div class="font-bold">${escapeHtml(s.name)}</div><div class="mt-1">Price: ${money(sellingRate(s))} per 1,000 · Minimum: ${s.min??1} · Maximum: ${s.max??"—"}</div>`;
 details.classList.remove("hidden");
 quantityInput.min=s.min||1;quantityInput.max=s.max||"";
 refreshSummary();
}
function refreshSummary(){
 const s=selected(),q=Number(quantityInput.value)||0,rate=s?sellingRate(s):null;
 document.getElementById("summaryPlatform").textContent=platform.value;
 document.getElementById("summaryType").textContent=boostType.value||"—";
 document.getElementById("summaryService").textContent=s?s.name:"—";
 document.getElementById("summaryRate").textContent=s?money(rate):"—";
 document.getElementById("summaryQuantity").textContent=q?q.toLocaleString():"—";
 document.getElementById("summaryTotal").textContent=money(s&&q>0?rate*q/1000:0);
}
serviceSelect.addEventListener("change",()=>{const s=selected();if(!s){details.classList.add("hidden");refreshSummary();return}showSelectedDetails(s)});
platform.addEventListener("change",render);boostType.addEventListener("change",render);quantityInput.addEventListener("input",refreshSummary);linkInput.addEventListener("input",refreshSummary);
document.getElementById("orderForm").addEventListener("submit",async e=>{e.preventDefault();if(!token){location.href="./login.html";return}const s=selected(),quantity=Number(quantityInput.value),link=linkInput.value.trim();if(!boostType.value){toastWarning("Choose a boost type first.");return}if(!s){toastWarning("Choose a service.");return}if(!/^https?:\/\//i.test(link)){toastError("Enter a valid target link.");return}if(!Number.isInteger(quantity)||quantity<Number(s.min||1)||quantity>Number(s.max||Number.MAX_SAFE_INTEGER)){toastError(`Quantity must be between ${s.min||1} and ${s.max||"the maximum"}.`);return}submit.disabled=true;submit.textContent="Submitting order…";try{const r=await fetch(API+"/orders/owlet",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({service:Number(s.providerServiceId),serviceName:s.name,platform:platform.value,boostType:boostType.value,link,quantity})});const d=await r.json();if(!r.ok)throw Error(d.message||"Order failed");localStorage.setItem("currentUser",JSON.stringify({...JSON.parse(localStorage.getItem("currentUser")||"{}"),balance:d.balance}));toastSuccess("Order submitted successfully.");setTimeout(()=>location.href="./my-orders.html",900)}catch(err){toastError(err.message||"Unable to place order.")}finally{submit.disabled=false;submit.textContent="Place order"}});
let catalogPoll=null;
let lastCatalogSignature=null;
async function load(showLoading=true){
 if(!token){location.href="./login.html";return}
 if(showLoading)serviceSelect.innerHTML='<option value="">Loading services...</option>';
 try{
  const r=await fetch(API+"/services",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  const d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load services");
  const incoming=Array.isArray(d.services)?d.services.filter(x=>x.provider==="owlet"&&x.providerServiceId&&x.active):[];
  const signature=incoming.map(x=>[x.providerServiceId,x.name,x.platform,x.pricePer1000,x.min,x.max,x.active].join("|")).join(";");
  if(signature!==lastCatalogSignature){
   services=incoming;lastCatalogSignature=signature;
   const remembered=localStorage.getItem("selectedPlatform");
   if(remembered&&[...platform.options].some(o=>o.value===remembered||o.text===remembered))platform.value=remembered;
   render();
  }
  // Background refreshes must never reset the selected service or the user's form values.
  if(d.refreshing&&!catalogPoll){catalogPoll=setTimeout(async()=>{catalogPoll=null;await load(false)},12000)}
 }catch(e){
  if(!services.length)serviceSelect.innerHTML='<option value="">Services unavailable — try again</option>';
  toastError("Error");
 }
}
load();
</script>
    <script src="./toast.js"></script>\n</body></html>
