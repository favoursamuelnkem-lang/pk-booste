<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a Platform | PK-BOOSTER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="assets/favicon.png"><style>
:root{--pink:#7C3AED;--accent:#7C3AED;--ink:#201827;--muted:#786d7d;--line:#eadfea;--bg:#fcf9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{height:52px;background:#fff;border-bottom:1px solid var(--line)}nav{height:100%;display:flex;align-items:center;gap:26px;padding:0 max(24px,calc((100% - 1240px)/2))}.logo{font-weight:900;color:#7C3AED;font-size:24px;line-height:.72;letter-spacing:-1.5px;text-decoration:none;margin-right:4px}.logo small{display:block;font-size:12px}.links{display:flex;align-items:center;gap:4px}.links a{padding:11px 14px;text-decoration:none;color:#5c5261;font-size:13px;font-weight:700;border-radius:12px}.links a.active{background:#F3E8FF;color:var(--pink)}.right{margin-left:auto;display:flex;align-items:center;gap:10px}.balance,.lang{height:40px;border:1px solid #e2d6e5;background:white;border-radius:22px;display:flex;align-items:center;padding:0 8px 0 14px;font-size:13px;font-weight:800;gap:9px}.add{border:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;line-height:1;cursor:pointer}.lang{border-radius:12px;padding:0 13px}.wrap{width:min(610px,calc(100% - 32px));margin:18px auto 60px}.step{font-size:12px;font-weight:700;color:#786d7d;margin-bottom:9px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}.progress span{height:6px;border-radius:8px;background:#e4d9e5}.progress span:first-child{background:var(--pink)}h1{font-size:27px;letter-spacing:-1px;margin:0 0 16px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.card{height:109px;border:1px solid var(--line);background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);font:inherit;cursor:pointer;position:relative;transition:.16s}.card:hover,.card:focus-visible{border-color:#7C3AED;box-shadow:0 5px 18px #7C3AED18;transform:translateY(-1px);outline:none}.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:white;font-size:25px;font-weight:800}.card b{font-size:13px;line-height:1.25;text-align:center}.tiktok{background:#050505}.instagram{background:#ed3e63}.facebook{background:#0866ff}.telegram{background:#24a5df}.youtube{background:#ff0808}.whatsapp{background:#20cf68}.others{background:#fff;color:#171717;border:2px solid #222;border-radius:50%;width:38px;height:38px;font-size:18px}.numbers{background:#F3E8FF;color:var(--pink);font-size:22px}.new{position:absolute;top:7px;right:6px;background:var(--accent);color:#fff;border-radius:12px;padding:3px 7px;font-size:10px;font-weight:800}.numbers-card{gap:7px}@media(max-width:650px){.top{height:auto;min-height:58px}nav{padding:9px 14px;gap:10px;flex-wrap:wrap}.logo{font-size:21px}.links{order:3;width:100%;justify-content:space-between}.links a{padding:9px 10px;font-size:12px}.right{gap:6px}.balance,.lang{height:35px;font-size:11px}.add{width:26px;height:26px}.wrap{margin-top:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{height:108px;border-radius:16px}h1{font-size:25px}.step{font-size:12px}}@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.right{margin-left:auto}.links a{padding:8px 7px}}
</style></head><body><header class="top"><nav><a class="logo" href="./home.html">PK-<small>BOOSTER</small></a><div class="links"><a class="active" href="./home.html">Order</a><a href="./my-orders.html">My orders</a><a href="./wallet.html">Wallet</a><a href="./more.html">More</a></div><div class="right"><div class="balance"><span id="walletBalance">₦0.00</span><button class="add" onclick="location.href='./add-money.html'" aria-label="Add money">+</button></div><div class="lang">◎ EN⌄</div></div></nav></header><main class="wrap"><div class="step">Step 1 of 4</div><div class="progress"><span></span><span></span><span></span><span></span></div><h1>What do you want to grow?</h1><div class="grid" id="platformGrid">
<button class="card" data-platform="TikTok"><span class="icon tiktok">♪</span><b>TikTok</b></button><button class="card" data-platform="Instagram"><span class="icon instagram">◎</span><b>Instagram</b></button><button class="card" data-platform="Facebook"><span class="icon facebook">f</span><b>Facebook</b></button><button class="card" data-platform="Telegram"><span class="icon telegram">➤</span><b>Telegram</b></button><button class="card" data-platform="YouTube"><span class="icon youtube">▶</span><b>YouTube</b></button><button class="card" data-platform="WhatsApp"><span class="icon whatsapp">◉</span><b>WhatsApp</b></button><button class="card" data-platform="Others"><span class="icon others">•••</span><b>Others</b></button><button class="card numbers-card" data-platform="Numbers & Emails"><span class="new">NEW</span><span class="icon numbers">♧</span><b>Numbers &amp;<br> emails</b></button></div></main><script>
(function(){const token=localStorage.getItem('token')||sessionStorage.getItem('token');if(!token){location.replace('./login.html');return;}try{const u=JSON.parse(localStorage.getItem('currentUser')||'{}');const n=Number(u.balance||0);document.getElementById('walletBalance').textContent='₦'+n.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});}catch(e){}document.querySelectorAll('[data-platform]').forEach(card=>card.addEventListener('click',()=>{const value=card.dataset.platform;localStorage.setItem('pkBoosterSelectedPlatform',value);location.href='./order.html?platform='+encodeURIComponent(value)}));})();
</script></body></html>
