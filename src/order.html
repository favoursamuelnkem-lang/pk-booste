    <script>
        const platformCards = document.querySelectorAll(".platform-card");
        const selectionMessage = document.getElementById("selectionMessage");
        const selectedPlatformText = document.getElementById("selectedPlatform");
        const continueButton = document.getElementById("continueButton");
        const pageMessage = document.getElementById("pageMessage");

        let selectedPlatform = "";

        function formatNaira(amount) {
            return new Intl.NumberFormat("en-NG", {
                style: "currency",
                currency: "NGN",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function loadWalletBalance() {
            const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");

            const storedBalance = localStorage.getItem("walletBalance");

            const balance = storedBalance !== null
                ? Number(storedBalance)
                : Number(currentUser.balance || 0);

            document.getElementById("walletBalance").textContent = formatNaira(balance);
        }

        platformCards.forEach((card) => {
            card.addEventListener("click", () => {
                selectedPlatform = card.dataset.platform;

                platformCards.forEach((item) => {
                    item.classList.remove("border-[#7C3AED]", "bg-[#F8EFFF]", "ring-1", "ring-[#7C3AED]");

                    item.classList.add("border-[#EEE3EF]", "bg-white");
                });

                card.classList.remove("border-[#EEE3EF]", "bg-white");

                card.classList.add("border-[#7C3AED]", "bg-[#F8EFFF]", "ring-1", "ring-[#7C3AED]");

                selectedPlatformText.textContent = selectedPlatform;

                selectionMessage.classList.remove("hidden");

                pageMessage.classList.add("hidden");
            });
        });

        continueButton.addEventListener("click", () => {
            if (!selectedPlatform) {
                pageMessage.textContent = "Please select a platform first.";

                pageMessage.classList.remove("hidden");

                return;
            }

            localStorage.setItem("selectedPlatform", selectedPlatform);

            window.location.href = "./services.html";
        });

        const moreButton = document.getElementById("moreButton");
        const moreMenu = document.getElementById("moreMenu");

        moreButton.addEventListener("click", () => {
            moreMenu.classList.toggle("hidden");
        });

        const mobileMoreButton = document.getElementById("mobileMoreButton");
        const mobileMoreMenu = document.getElementById("mobileMoreMenu");

        mobileMoreButton.addEventListener("click", () => {
            mobileMoreMenu.classList.toggle("hidden");
        });

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("currentUser");

            window.location.href = "./login.html";
        }

        document.getElementById("logoutButton").addEventListener("click", logout);

        document.getElementById("mobileLogoutButton").addEventListener("click", logout);

        document.addEventListener("click", (event) => {
            if (!moreButton.contains(event.target) && !moreMenu.contains(event.target)) {
                moreMenu.classList.add("hidden");
            }
        });

        loadWalletBalance();
    </script>
